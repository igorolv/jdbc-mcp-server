name: Release

# Push a tag like v0.1.0 to build the fat jar, publish it as a GitHub Release, push the Docker
# image to ghcr.io/igorolv/jdbc-mcp-server:<version> and :latest, and register that image
# version in the official MCP Registry (registry.modelcontextprotocol.io).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write   # OIDC login to the MCP Registry

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew test --no-daemon -Pversion=${{ steps.version.outputs.value }}

      - name: Build fat jar
        run: ./gradlew bootJar --no-daemon -Pversion=${{ steps.version.outputs.value }}

      - name: Attach checksum
        run: |
          cd build/libs
          sha256sum jdbc-mcp-server.jar > jdbc-mcp-server.jar.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/libs/jdbc-mcp-server.jar
            build/libs/jdbc-mcp-server.jar.sha256

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mcp-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Stamp version into server.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION"              '.version = $v | .packages[0].identifier = "ghcr.io/igorolv/jdbc-mcp-server:" + $v'              server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Log in to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish server.json
