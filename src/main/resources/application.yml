spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    mcp:
      server:
        name: jdbc-mcp-server
        version: 0.1.0
        stdio: true
  # Disable Spring Boot's default DataSource autoconfiguration. The root context has no
  # DataSource at all — each connection builds its own read-only, dialect-aware pool inside its
  # per-connection context, with the driver detected from the JDBC URL.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

# Top-level server data directory — all local storage is rooted here. Each connection gets its own
# slot under <data-dir>/<connection>/ (usage-catalog/, logs/, the persisted snapshot).
jdbc-mcp:
  data-dir: ${JDBC_MCP_DATA_DIR:${user.home}/.jdbc-mcp-server}
  # JSON file describing the named connections this server serves — the only place databases,
  # credentials and their per-connection settings are configured. Defaults to
  # <data-dir>/connections.json; startup fails when it is missing or defines no connection.
  connections-file: ${JDBC_MCP_CONNECTIONS_FILE:}
  resources:
    # Opt in to a catalog-qualified manifest, concrete snapshot tables, and table/column URI templates.
    enabled: ${JDBC_MCP_RESOURCES_ENABLED:false}
  # Which tool groups are exposed in the MCP tools/list manifest. All groups are on by default;
  # turn groups off (e.g. JDBC_MCP_TOOLS_STATS=false) to shrink the manifest for small-context
  # (local) models that would otherwise be flooded at session start. Each flag toggles one @Service.
  tools:
    metadata: ${JDBC_MCP_TOOLS_METADATA:true}            # schemas/tables/columns/views/routines/search
    query: ${JDBC_MCP_TOOLS_QUERY:true}                  # executeQuery
    admin: ${JDBC_MCP_TOOLS_ADMIN:true}                  # rebuildCatalog
    sample: ${JDBC_MCP_TOOLS_SAMPLE:true}                # sampleRows
    analysis: ${JDBC_MCP_TOOLS_ANALYSIS:true}            # explain/analyzePlan/validate/inspect/lint/lineage
    distribution: ${JDBC_MCP_TOOLS_DISTRIBUTION:true}    # column stats/histograms/selectivity
    stats: ${JDBC_MCP_TOOLS_STATS:true}                  # table/index stats, unused/redundant indexes
    benchmark: ${JDBC_MCP_TOOLS_BENCHMARK:true}          # benchmarkQuery/timedQuery
    usage: ${JDBC_MCP_TOOLS_USAGE:true}                  # usage-catalog lookups
    schema-context: ${JDBC_MCP_TOOLS_SCHEMA_CONTEXT:true} # tableContext/joinPaths/schemaGraph/lint
    connections: ${JDBC_MCP_TOOLS_CONNECTIONS:true}      # listConnections

