spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    mcp:
      server:
        name: jdbc-mcp-server
        version: 0.1.0
        stdio: true
  # Disable Spring Boot's default DataSource autoconfiguration — we build
  # the DataSource ourselves in DataSourceConfig so we can apply dialect-aware
  # read-only settings and auto-detect the driver from the JDBC URL.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Top-level server data directory — all local storage is rooted here.
jdbc-mcp:
  data-dir: ${JDBC_MCP_DATA_DIR:${user.home}/.jdbc-mcp-server}
  # Name of the local catalog (knowledge store) for the inspected database. It is the slot key
  # under <data-dir>/<name>/ for everything we keep about this DB (usage-catalog/, logs/, and the
  # future persisted snapshot). Defaults to "default". Run several DBs by launching several server
  # instances, each with its own JDBC_MCP_CATALOG.
  catalog-name: ${JDBC_MCP_CATALOG:default}
  resources:
    # Expose a catalog-qualified manifest, concrete snapshot tables, and table/column URI templates.
    enabled: ${JDBC_MCP_RESOURCES_ENABLED:true}
  # Which tool groups are exposed in the MCP tools/list manifest. All groups are on by default;
  # turn groups off (e.g. JDBC_MCP_TOOLS_STATS=false) to shrink the manifest for small-context
  # (local) models that would otherwise be flooded at session start. Each flag toggles one @Service.
  tools:
    metadata: ${JDBC_MCP_TOOLS_METADATA:true}            # schemas/tables/columns/views/routines/search
    query: ${JDBC_MCP_TOOLS_QUERY:true}                  # executeQuery
    admin: ${JDBC_MCP_TOOLS_ADMIN:true}                  # rebuildCatalog
    sample: ${JDBC_MCP_TOOLS_SAMPLE:true}                # sampleRows
    analysis: ${JDBC_MCP_TOOLS_ANALYSIS:true}            # explain/analyzePlan/validate/inspect/lint/lineage
    distribution: ${JDBC_MCP_TOOLS_DISTRIBUTION:true}    # column stats/histograms/selectivity
    stats: ${JDBC_MCP_TOOLS_STATS:true}                  # table/index stats, unused/redundant indexes
    benchmark: ${JDBC_MCP_TOOLS_BENCHMARK:true}          # benchmarkQuery/timedQuery
    usage: ${JDBC_MCP_TOOLS_USAGE:true}                  # usage-catalog lookups
    schema-context: ${JDBC_MCP_TOOLS_SCHEMA_CONTEXT:true} # tableContext/joinPaths/schemaGraph/lint

jdbc:
  url: ${JDBC_URL:}
  username: ${JDBC_USERNAME:}
  password: ${JDBC_PASSWORD:}
  default-schema: ${JDBC_DEFAULT_SCHEMA:}
  query-timeout-seconds: ${JDBC_QUERY_TIMEOUT_SECONDS:30}
  max-rows: ${JDBC_MAX_ROWS:1000}
  fetch-size: ${JDBC_FETCH_SIZE:500}
  readonly-guard: ${JDBC_READONLY_GUARD:strict}
  pool-maximum-size: ${JDBC_POOL_MAX_SIZE:40}
  pool-minimum-idle: ${JDBC_POOL_MIN_IDLE:0}
  connection-timeout-ms: ${JDBC_CONNECTION_TIMEOUT_MS:10000}
  validation-timeout-ms: ${JDBC_VALIDATION_TIMEOUT_MS:5000}
  idle-timeout-ms: ${JDBC_POOL_IDLE_TIMEOUT_MS:60000}

structure-snapshot:
  # Schemas to front-load into the persistent structure snapshot on a full rebuild.
  # CSV; empty falls back to the default schema (like usage.native-schemas).
  schemas: ${JDBC_STRUCTURE_SNAPSHOT_SCHEMAS:}
  # Oracle only: timeout for the DBMS_XMLGEN-backed bulk column/default query during rebuild.
  # Kept separate from JDBC_QUERY_TIMEOUT_SECONDS so ordinary tool calls remain responsive.
  # 0 disables the JDBC statement timeout for this query.
  oracle-column-query-timeout-seconds: ${JDBC_STRUCTURE_SNAPSHOT_ORACLE_COLUMN_QUERY_TIMEOUT_SECONDS:300}

usage:
  catalog-enabled: ${JDBC_USAGE_CATALOG_ENABLED:true}
  # Additional directories, JSON files, or zip archives with canonical QueryUsage records.
  # The default {dataDir}/usage-catalog is always included.
  catalog-paths: ${JDBC_USAGE_CATALOG_PATHS:}
  native-schemas: ${JDBC_USAGE_NATIVE_SCHEMAS:}
  native-include-views: ${JDBC_USAGE_NATIVE_INCLUDE_VIEWS:true}
  native-include-routines: ${JDBC_USAGE_NATIVE_INCLUDE_ROUTINES:true}
  native-include-triggers: ${JDBC_USAGE_NATIVE_INCLUDE_TRIGGERS:true}
  native-max-objects: ${JDBC_USAGE_NATIVE_MAX_OBJECTS:10000}
